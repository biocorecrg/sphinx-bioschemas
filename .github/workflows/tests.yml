name: Test Sphinx Bioschemas Extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        sphinx-version: ["5.3.0", "6.2.1", "7.4.7", "8.2.3", "9.0.4", "9.1.1", "9.2.0"]
        exclude:
          # Sphinx 5.3 imports imghdr, which Python 3.13 removed.
          - python-version: "3.13"
            sphinx-version: "5.3.0"
          - python-version: "3.14"
            sphinx-version: "5.3.0"
          # Sphinx 9.1 requires Python >= 3.12; Sphinx 9.2 requires Python >= 3.13.
          - python-version: "3.11"
            sphinx-version: "9.1.1"
          - python-version: "3.11"
            sphinx-version: "9.2.0"
          - python-version: "3.12"
            sphinx-version: "9.2.0"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
          pip install "sphinx==${{ matrix.sphinx-version }}"

      - name: Run tests
        run: |
          pytest

  test-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,validate]'

      - name: Run tests
        run: |
          pytest

  docs:
    # The docs validate their own Bioschemas markup (bioschemas_validate = "warn"), so a
    # warning-free build is an end-to-end check of the validator.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r docs/requirements.txt

      - name: Build docs (warnings are errors)
        run: |
          make -C docs html SPHINXOPTS="-W --keep-going"
